<style>
    .pixel-koish-art {
        image-rendering: pixelated;
        width: 160px;
        height: 160px;

        transform: scale(-1, 1);

<layout-row class="genric-card" style="width: 100%; height: 200px" padding="24px">
    <layout-column style="width: 70%">
        <span class="section-title" style="color: #3b6ef3">BLOG</span>
