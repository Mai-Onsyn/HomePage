<style>
    .head-image {
        width: 180px;
        height: 180px;
        border-radius: 8px;
    }

    .icon {
        width: 16px;
        height: 16px;
    }
</style>

<layout-row class="genric-card" style="width: 960px; height: 400px;">
    <ordinal-label text="01"></ordinal-label>

    <horizontal-spacer size="24px"></horizontal-spacer>

    <layout-box alignment="Center" style="width: 280px; height: 100%;">
        <layout-column horizontal-alignment="Center" gap="8px">
            <img src="../../assets/images/head-image.jpg" alt="头像" class="head-image">

            <vertical-spacer size="16px"></vertical-spacer>

            <layout-row align-self="Start" gap="24px" vertical-alignment="Center">
                <img src="../../assets/icon/email.png" alt="邮箱" class="icon">
                <p class="prompt-text">mai_onsyn@qq.com</p>
            </layout-row>

            <layout-row align-self="Start" gap="24px" vertical-alignment="Center">
                <img src="../../assets/icon/location.png" alt="位置" class="icon">
                <p class="prompt-text">China - UTC+8</p>
            </layout-row>

            <vertical-spacer size="8"></vertical-spacer>

            <layout-row gap="24px" vertical-alignment="Center">
                <generic-button width="48px" height="48px" border-radius="50%">
                    <object data="../../assets/icon/github.svg" type="image/svg+xml" width="32" height="32"></object>
                </generic-button>
                <generic-button width="48px" height="48px" border-radius="50%">
                    <object data="../../assets/icon/bilibili.svg" type="image/svg+xml" width="42" height="42"></object>
                </generic-button>
            </layout-row>
        </layout-column>
    </layout-box>

    <horizontal-spacer size="24px"></horizontal-spacer>

    <layout-box alignment="CenterStart" class="fill-max-size">
        <layout-column style="width: 80%">
            <p class="prompt-text">Hello, I'm ✨</p>
            <h1 class="title-text">Lao Mu Ji Ka</h1>
            <p class="prompt-text" style="color: #3b6ef3; font-size: 16px">设计 / 开发 / 探索 / 分享</p>
            <vertical-spacer size="24px"></vertical-spacer>
            <p class="prompt-text" style="line-height: 16px">必须含有 viewBox：例如 viewBox="0 0 1024 1024"（根据你复制的实际数值来）。 强制等比居中缩放：在svg标签上加上 preserveAspectRatio="xMidYMid meet"。这行代码的意思是：强制让 SVG 图形在容器内水平居中、垂直居中，并等比缩放去掉死高度：建议把 SVG 文件内的 width 和 height 改为 100% 或者删掉，让它完全听从 HTML 调用时给的尺寸。</p>
        </layout-column>
    </layout-box>
</layout-row>
