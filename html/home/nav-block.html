<style>
    .nav-card {
        background-color: transparent;
        cursor: pointer;
        box-shadow: 0 2px 4px 2px rgba(0, 0, 0, 0.1);

        transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1),
        box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .nav-card * {
        pointer-events: none;
    }

    .nav-card:hover {
        transform: scale(1.04) translateY(-8px);
        box-shadow: 0 16px 32px rgba(0, 0, 0, 0.3);
    }

    .nav-card:active {
        transform: scale(1.02) translateY(-4px);
        box-shadow: 0 2px 4px 2px rgba(0, 0, 0, 0.1);
    }

    .nav-icon-spread {
        position: relative;
        --spread-color: var(#BC8F8F);
    }

    .nav-icon-spread::before {
        content: "";
        position: absolute;

        --circle-radius: 20px;
        width: calc(var(--circle-radius) * 2);
        height: calc(var(--circle-radius) * 2);

        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

        background-color: var(--spread-color);
        border-radius: 50%;

        filter: blur(20px);
        z-index: 0;
        pointer-events: none;
    }
</style>

<layout-row class="genric-card" style="width: 960px; height: 200px;">
    <horizontal-spacer size="24px"></horizontal-spacer>
    <layout-column class="fill-max-size">
        <vertical-spacer size="16px"></vertical-spacer>
        <p class="section-title">MAIN NAVIGATION</p>
        <p class="section-title">导航</p>
        <vertical-spacer size="16px"></vertical-spacer>

        <layout-row gap="16px" class="fill-max-size">
            <layout-box id="portfolio-btn" weight="1" class="genric-card nav-card" padding="8px">
                <layout-column align-self="Center">
                    <layout-row gap="16px" vertical-alignment="Center">
                        <div class="nav-icon-spread" style="--spread-color: #6C5CE7">
                            <object data="../../assets/icon/folder.svg" type="image/svg+xml" width="28" height="28"></object>
                        </div>
                        <layout-column>
                            <p class="section-title">作品集</p>
                            <p class="prompt-text-small">PORTFOLIO</p>
                        </layout-column>
                    </layout-row>
                    <vertical-spacer size="8px"></vertical-spacer>
                    <p align-self="Center" class="prompt-text">探索精彩作品</p>
                </layout-column>
                <p align-self="BottomEnd" class="prompt-text" style="line-height: 10px">→</p>
            </layout-box>

            <layout-box id="blog-btn" weight="1" class="genric-card nav-card" padding="8px">
                <layout-column align-self="Center">
                    <layout-row gap="16px" vertical-alignment="Center">
                        <div class="nav-icon-spread" style="--spread-color: #2D6AFF">
                            <object data="../../assets/icon/blog.svg" type="image/svg+xml" width="28" height="28"></object>
                        </div>
                        <layout-column>
                            <p class="section-title">博客</p>
                            <p class="prompt-text-small">BLOG</p>
                        </layout-column>
                    </layout-row>
                    <vertical-spacer size="8px"></vertical-spacer>
                    <p align-self="Center" class="prompt-text">记录思考，技术与生活</p>
                </layout-column>
                <p align-self="BottomEnd" class="prompt-text" style="line-height: 10px">→</p>
            </layout-box>

            <layout-box id="gest-book-btn" weight="1" class="genric-card nav-card" padding="8px">
                <layout-column align-self="Center">
                    <layout-row gap="16px" vertical-alignment="Center">
                        <div class="nav-icon-spread" style="--spread-color: #10AC84">
                            <object data="../../assets/icon/discussion.svg" type="image/svg+xml" width="28" height="28"></object>
                        </div>
                        <layout-column>
                            <p class="section-title">留言板</p>
                            <p class="prompt-text-small">GUESTBOOK</p>
                        </layout-column>
                    </layout-row>
                    <vertical-spacer size="8px"></vertical-spacer>
                    <p align-self="Center" class="prompt-text">留下你宝贵的建议</p>
                </layout-column>
                <p align-self="BottomEnd" class="prompt-text" style="line-height: 10px">→</p>
            </layout-box>

            <layout-box id="toolkit-btn" weight="1" class="genric-card nav-card" padding="8px">
                <layout-column align-self="Center">
                    <layout-row gap="16px" vertical-alignment="Center">
                        <div class="nav-icon-spread" style="--spread-color: #FF9F43">
                            <object data="../../assets/icon/wrench.svg" type="image/svg+xml" width="28" height="28"></object>
                        </div>
                        <layout-column>
                            <p class="section-title">工具箱</p>
                            <p class="prompt-text-small">TOOLKIT</p>
                        </layout-column>
                    </layout-row>
                    <vertical-spacer size="8px"></vertical-spacer>
                    <p align-self="Center" class="prompt-text">有趣且实用的分享</p>
                </layout-column>
                <p align-self="BottomEnd" class="prompt-text" style="line-height: 10px">→</p>
            </layout-box>

            <horizontal-spacer siz="8px"></horizontal-spacer>
        </layout-row>
        <vertical-spacer size="24px"></vertical-spacer>
    </layout-column>
    <solid-book-mark text="02" flip="true"></solid-book-mark>
</layout-row>

<script>
    document.getElementById("portfolio-btn").addEventListener("click", () => {
        window.open("../html/portfolio.html", "_blank");
    })
</script>
