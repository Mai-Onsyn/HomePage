<style>
    .input-label {
        font-size: 14px;
        font-weight: bold;
        color: #2c3e50;
        margin-bottom: 8px;
    }
    .text-input {
        width: 40%;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 14px;
        box-sizing: border-box;
        transition: all 0.4s ease;
        color: #333;
    }
    .text-input:focus {
        outline: none;
        border-color: #3b6ef3;
        background-color: #fff;
        box-shadow: 0 0 16px 8px rgba(59, 110, 243, 0.1);
    }
    .textarea-input {
        width: 100%;
        min-height: 120px;
        border-radius: 8px;
        padding: 16px;
        font-size: 14px;
        font-family: "Microsoft YaHei UI", Arial sans-serif;
        box-sizing: border-box;
        resize: vertical;
        transition: all 0.4s ease;
        color: #333;
    }
    .textarea-input:focus {
        outline: none;
        border-color: #3b6ef3;
        background-color: #fff;
        box-shadow: 0 0 16px 8px rgba(59, 110, 243, 0.1);
    }

    .btn-submit {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.4s ease;

        padding: 0 20px;
        height: 40px;
        background-color: #3b6ef3;
        color: #ffffff;
        gap: 8px;
        box-shadow: 0 2px 4px 2px rgba(0, 0, 0, 0.1);
    }
    .btn-submit:hover {
        background-color: #2a56cd;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        transform: translate(0, -5px) scale(1.02);
    }

    .btn-submit:active {
        transform: scale(1.01) translateY(-2px);
        box-shadow: 0 2px 4px 2px rgba(0, 0, 0, 0.1);
    }
</style>

<layout-column class="genric-card" style="width: 960px" padding="24px" gap="32px">
    <layout-row style="width: 100%; justify-content: space-between; align-items: flex-start;">
        <layout-column style="gap: 8px;">
            <layout-row vertical-alignment="Center" style="gap: 8px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b6ef3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span class="title-text" style="">留言板</span>
            </layout-row>
            <span class="prompt-text" style="color: #8fa0b5; font-size: 14px">欢迎留下你的想法与建议，期待与你的交流！</span>
        </layout-column>
    </layout-row>

    <layout-column style="width: 100%; gap: 20px;">
        <layout-column>
            <label for="username" class="input-label">昵称</label>
            <input id="username" type="text" class="text-input genric-card" placeholder="请输入你的昵称" />
        </layout-column>

        <layout-column>
            <layout-box>
                <label for="comment" class="input-label" align-self="BottomStart">评论内容</label>
                <div style="padding-bottom: 8px" align-self="TopEnd">
                    <div id="submit-comment-btn" class="btn-submit">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                        <span>发送评论</span>
                    </div>
                </div>
            </layout-box>
            <textarea id="comment" class="textarea-input genric-card" placeholder="写下你的评论..."></textarea>
        </layout-column>
    </layout-column>
</layout-column>

<script>
    document.getElementById('submit-comment-btn').addEventListener('click', () => {
        const usernameElement = document.getElementById('username');
        const contentElement = document.getElementById('comment');
        const username = usernameElement.value.trim();
        const content = contentElement.value.trim();

        if (!username) {
            alert('请输入你的昵称！');
            usernameElement.focus();
            return;
        }

        if (!content) {
            alert('评论内容不能为空！');
            contentElement.focus();
            return; // 拦截拦截！
        }

        usernameElement.value = '';
        contentElement.value = '';

        document.getElementById('comment-flow-column').insertAdjacentHTML('beforeend', `
            <comment-card
                    name="${username}"
                    content="${content}"
                    date="${new Date().toLocaleString()}"
                    like="0"
                    dislike="0">
            </comment-card>
        `);
    });
</script>
